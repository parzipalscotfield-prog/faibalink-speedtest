<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAIBALINK Speed Test</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="app">

    <header>
      <div class="brand">
        <span class="dot"></span>FAIBA<span>LINK</span>
      </div>

      <div class="badge">NETWORK TEST</div>
    </header>

    <section class="hero">
      <p class="eyebrow">FAIBALINK INTERNET</p>

      <h1>Check your connection</h1>

      <p class="sub">
        Measure your connection to the FAIBALINK network.
      </p>
    </section>

    <section class="test-card">

      <div class="gauge">

        <div class="gauge-ring">

          <div class="speed" id="speed">0.0</div>

          <div class="unit">Mbps</div>

          <div class="phase" id="phase">READY</div>

        </div>

      </div>

      <div class="metrics">

        <div class="metric">
          <span>DOWNLOAD</span>
          <strong id="download">—</strong>
          <small>Mbps</small>
        </div>

        <div class="metric">
          <span>UPLOAD</span>
          <strong id="upload">—</strong>
          <small>Mbps</small>
        </div>

        <div class="metric">
          <span>PING</span>
          <strong id="ping">—</strong>
          <small>ms</small>
        </div>

      </div>

      <button id="startBtn">
        START TEST
      </button>

      <p class="status" id="status">
        Ready to test your FAIBALINK connection.
      </p>

    </section>

    <footer>
      FAIBALINK • Fast • Reliable • Unlimited
    </footer>

  </main>

  <script src="/app.js"></script>

</body>
</html>
