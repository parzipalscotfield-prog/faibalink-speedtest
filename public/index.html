<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FAIBALINK Speed Test</title>

  <meta
    name="description"
    content="Test your internet connection speed with the FAIBALINK Speed Test."
  >

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="app">

    <header>

      <div class="brand">
        <img
          src="/file_00000000a2b88246b5b0df73b6b4b436.jpg"
          alt="FAIBALINK"
          class="brand-logo"
        >
      </div>

      <div class="badge">
        NETWORK TEST
      </div>

    </header>


    <section class="hero">

      <p class="eyebrow">
        FAIBALINK INTERNET
      </p>

      <h1>
        Check your connection
      </h1>

      <p class="sub">
        Measure your connection speed to the FAIBALINK network.
      </p>

    </section>


    <section class="test-card">

      <div class="gauge">

        <div class="gauge-ring">

          <div class="speed" id="speed">
            0.0
          </div>

          <div class="unit">
            Mbps
          </div>

          <div class="phase" id="phase">
            READY
          </div>

        </div>

      </div>


      <div class="metrics">

        <div class="metric">
          <span>DOWNLOAD</span>
          <strong id="download">—</strong>
          <small>Mbps</small>
        </div>

        <div class="metric">
          <span>UPLOAD</span>
          <strong id="upload">—</strong>
          <small>Mbps</small>
        </div>

        <div class="metric">
          <span>PING</span>
          <strong id="ping">—</strong>
          <small>ms</small>
        </div>

      </div>


      <button id="startBtn">
        START TEST
      </button>


      <p class="status" id="status">
        Ready to test your FAIBALINK connection.
      </p>

    </section>


    <footer>
      <strong>FAIBALINK</strong>
      <br>
      Fast • Reliable • Unlimited
    </footer>

  </main>


  <script src="/app.js"></script>

</body>
</html>
